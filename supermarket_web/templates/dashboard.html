{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h3>Welcome, {{ session.get('username') }}</h3>
<div class="row mt-4">
  <div class="col-md-4">
    <div class="card"><div class="card-body">
      <h6 class="text-muted">Products</h6>
      <h2>{{ product_count }}</h2>
    </div></div>
  </div>
  <div class="col-md-4">
    <div class="card"><div class="card-body">
      <h6 class="text-muted">Sales today</h6>
      <h2>{{ "%.2f"|format(sales_today) }}</h2>
    </div></div>
  </div>
</div>
{% endblock %}
