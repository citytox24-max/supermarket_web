{% extends "base.html" %}
{% block title %}Products{% endblock %}
{% block content %}
<h3>Products</h3>
<form method="post" class="row g-2 mb-4">
  <div class="col-md-3"><input class="form-control" name="name" placeholder="Name" required></div>
  <div class="col-md-2"><input class="form-control" name="buy_price" type="number" step="0.01" placeholder="Buy price"></div>
  <div class="col-md-2"><input class="form-control" name="sell_price" type="number" step="0.01" placeholder="Sell price"></div>
  <div class="col-md-2"><input class="form-control" name="quantity" type="number" placeholder="Qty"></div>
  <div class="col-md-2"><button class="btn btn-primary w-100">Add product</button></div>
</form>
<table class="table bg-white">
  <thead><tr><th>Name</th><th>Buy</th><th>Sell</th><th>Qty</th><th></th></tr></thead>
  <tbody>
  {% for p in products %}
    <tr>
      <td>{{ p.name }}</td>
      <td>{{ p.buy_price }}</td>
      <td>{{ p.sell_price }}</td>
      <td>{{ p.quantity }}</td>
      <td>
        <form method="post" action="{{ url_for('delete_product', product_id=p.product_id) }}" class="d-inline">
          <button class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
